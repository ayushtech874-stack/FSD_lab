<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>With React Components - Reusable Building Blocks!</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .success {
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 20px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .role {
            color: #666;
            margin-bottom: 10px;
        }

        .email {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .counter-value {
            color: #333;
            font-size: 3em;
            font-weight: bold;
            margin: 15px 0;
        }

        .counter-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .benefit-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-top: 30px;
        }

        .benefit-box h2 {
            color: #4facfe;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .benefit-item {
            background: #d4edda;
            border-left: 5px solid #28a745;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .benefit-item h4 {
            color: #155724;
            margin-bottom: 10px;
        }

        .code-snippet {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin-top: 10px;
            white-space: pre;
            line-height: 1.5;
        }

        .highlight {
            background: #ffeb3b;
            padding: 2px 5px;
            border-radius: 3px;
            color: #333;
        }

        .component-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .component-box h2 {
            color: #4facfe;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-align: center;
        }

        .visual-explanation {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin: 20px 0;
        }

        .component-visual {
            background: #f0f0f0;
            border: 3px dashed #4facfe;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .arrow {
            font-size: 3em;
            color: #4facfe;
        }

        .reuse-visual {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <div class="container">
        
        <h1>✨ React Counter</h1>
        <p class="subtitle">Watch how NOTHING reloads!</p>

        <div class="success">
            ✅ A reusable React component powered by state
        </div>

        <div id="root"></div>

        
    <script type="text/babel">
        function Counter() {
            const [count, setCount] = React.useState(0);

            return (
                <div className="profile-card">
                    <div className="name">Counter</div>
                    <div className="counter-value" aria-live="polite">{count}</div>
                    <div className="counter-controls">
                        <button className="button" onClick={() => setCount(count - 1)} aria-label="Decrease count">-</button>
                        <button className="button" onClick={() => setCount(0)}>Reset</button>
                        <button className="button" onClick={() => setCount(count + 1)} aria-label="Increase count">+</button>
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <div className="cards-container">
                    <Counter />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
