<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Counter - Saved Across Reloads</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            color: #4facfe;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .success {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
            color: #155724;
            font-weight: bold;
        }

        .counter-display {
            font-size: 5em;
            font-weight: bold;
            color: #4facfe;
            margin: 30px 0;
            transition: transform 0.2s ease;
        }

        .counter-display.bump {
            transform: scale(1.2);
        }

        .error-message {
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
            border-radius: 8px;
            padding: 12px;
            margin: 16px 0;
        }

        button {
            background: #4facfe;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5em;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        button:hover {
            background: #3a9ae0;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        .counter-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .counter-controls button {
            flex: 1;
            padding: 16px 12px;
            font-size: 1.2em;
        }

        .reload-indicator {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .reload-indicator h2 {
            color: #0c5460;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .indicator-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .indicator-label {
            color: #666;
            font-weight: bold;
        }

        .indicator-value {
            background: #17a2b8;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-family: monospace;
            white-space: nowrap;
        }

        .stable {
            background: #28a745;
        }

        .explanation {
            background: #d4edda;
            border-left: 5px solid #28a745;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
            border-radius: 5px;
        }

        .explanation h2 {
            color: #155724;
            margin-bottom: 10px;
        }

        .explanation ul {
            margin-left: 20px;
            line-height: 2;
        }

        .click-counter {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .indicator-item {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useState } = React;

        function CounterDisplay({ value, bump }) {
            return (
                <div className={`counter-display ${bump ? 'bump' : ''}`} aria-live="polite">
                    {value}
                </div>
            );
        }

        function IndicatorItem({ label, value, stable = false }) {
            return (
                <div className="indicator-item">
                    <span className="indicator-label">{label}</span>
                    <span className={`indicator-value ${stable ? 'stable' : ''}`}>{value}</span>
                </div>
            );
        }

        function ReloadProof({ time, randomNumber, clicks }) {
            return (
                <section className="reload-indicator" aria-labelledby="reload-proof-title">
                    <h2 id="reload-proof-title">Session Details</h2>
                    <IndicatorItem label="Page loaded at:" value={time} stable />
                    <IndicatorItem label="Random number this load:" value={randomNumber} stable />
                    <IndicatorItem label="Times clicked this session:" value={clicks} />
                </section>
            );
        }

        function Explanation() {
            return (
                <section className="explanation" aria-labelledby="explanation-title">
                    <h2 id="explanation-title">What's Happening?</h2>
                    <ul>
                        <li><strong>No page reload</strong> - React updates the counter in place.</li>
                        <li><strong>Counter persists</strong> - the backend saves the count between page loads.</li>
                        <li><strong>Session details</strong> - the timestamp and random number are generated on each page load.</li>
                        <li><strong>Fast updates</strong> - the display refreshes after the server saves each change.</li>
                    </ul>
                </section>
            );
        }

        function getRequestErrorMessage(requestError) {
            if (requestError instanceof TypeError) {
                return "Cannot connect to the counter backend. In the reactjs folder, run `node server.js`, then open http://localhost:3000.";
            }

            return requestError.message;
        }

        function CounterApp() {
            const [counter, setCounter] = useState(null);
            const [clicks, setClicks] = useState(0);
            const [timestamp] = useState(() => new Date());
            const [randomNumber] = useState(() => Math.floor(Math.random() * 1000));
            const [bump, setBump] = useState(false);
            const [loading, setLoading] = useState(true);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState("");
            const time = timestamp.toLocaleTimeString([], { hour12: false });

            async function loadCounter() {
                setLoading(true);
                setError("");

                try {
                    const response = await fetch("/api/counter");
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Could not load the counter.");
                    setCounter(data.counter);
                } catch (requestError) {
                    setError(getRequestErrorMessage(requestError));
                } finally {
                    setLoading(false);
                }
            }

            useEffect(() => {
                loadCounter();
            }, []);

            async function handleAction(action) {
                setBusy(true);
                setError("");

                try {
                    const response = await fetch("/api/counter", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action }),
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Could not save the counter.");
                    setCounter(data.counter);
                    setClicks(value => value + 1);
                    setBump(true);
                    window.setTimeout(() => setBump(false), 200);
                } catch (requestError) {
                    setError(getRequestErrorMessage(requestError));
                } finally {
                    setBusy(false);
                }
            }

            const controlsDisabled = loading || busy || counter === null;

            return (
                <main className="container">
                    <h1>React Counter</h1>
                    <p className="subtitle">Your count is saved across page reloads.</p>
                    <div className="success">The backend saves the counter after every change.</div>
                    {error && (
                        <div className="error-message" role="alert">
                            {error} {counter === null && <button onClick={loadCounter}>Retry</button>}
                        </div>
                    )}
                    <CounterDisplay value={loading ? "..." : counter ?? "Unavailable"} bump={bump} />
                    <div className="counter-controls">
                        <button onClick={() => handleAction("decrement")} disabled={controlsDisabled} aria-label="Decrement counter">-</button>
                        <button onClick={() => handleAction("reset")} disabled={controlsDisabled}>Reset</button>
                        <button onClick={() => handleAction("increment")} disabled={controlsDisabled} aria-label="Increment counter">+</button>
                    </div>
                    <ReloadProof time={time} randomNumber={randomNumber} clicks={clicks} />
                    <Explanation />
                    <p className="click-counter">
                        You changed the counter <strong>{clicks}</strong> times this session.
                    </p>
                </main>
            );
        }

        ReactDOM.render(<CounterApp />, document.getElementById('root'));
    </script>
</body>
</html>
