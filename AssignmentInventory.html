<!DOCTYPE html>
<html>
<head>
  <title>Inventory Management System</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f2f2f2;
    }

    #box {
      width: 900px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border: 1px solid gray;
    }

    input, select {
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px 12px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    .stat {
      display: inline-block;
      width: 250px;
      background-color: #eeeeee;
      text-align: center;
      padding: 15px;
      margin: 10px 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid gray;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #eeeeee;
    }
  </style>
</head>
<body>

  <div id="box">
    <h2>Inventory Management System</h2>

    <!-- form -->
    <input type="text" id="id" placeholder="Product ID">
    <input type="text" id="name" placeholder="Product Name">
    <select id="category">
      <option value="">Category</option>
      <option>Electronics</option>
      <option>Clothing</option>
      <option>Food</option>
      <option>Other</option>
    </select>
    <input type="number" id="price" placeholder="Price">
    <input type="number" id="quantity" placeholder="Quantity">
    <br>
    <button id="addButton" onclick="addProduct()">Add Product</button>

    <!-- statistics -->
    <br>
    <div class="stat">
      <h2 id="totalProducts">0</h2>
      Total Products
    </div>
    <div class="stat">
      <h2 id="totalValue">0</h2>
      Total Inventory Value
    </div>
    <div class="stat">
      <h2 id="lowStock">0</h2>
      Low Stock Products
    </div>

    <!-- search and filter -->
    <p>
      Search:
      <input type="text" id="search" placeholder="Search product..." onkeyup="showProducts()">
      Category:
      <select id="filter" onchange="showProducts()">
        <option>All Categories</option>
        <option>Electronics</option>
        <option>Clothing</option>
        <option>Food</option>
        <option>Other</option>
      </select>
    </p>

    <!-- table -->
    <table>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Category</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Status</th>
        <th>Inventory Value</th>
        <th>Actions</th>
      </tr>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // all products are stored in this list
    var products = [];

    // -1 means we are not editing anything
    var editIndex = -1;

    // get the saved products from localStorage
    var saved = localStorage.getItem("products");
    if (saved != null) {
      products = JSON.parse(saved);
    }

    // add a new product or update an old one
    function addProduct() {
      var id = document.getElementById("id").value;
      var name = document.getElementById("name").value;
      var category = document.getElementById("category").value;
      var price = document.getElementById("price").value;
      var quantity = document.getElementById("quantity").value;

      // all fields are required
      if (id == "" || name == "" || category == "" || price == "" || quantity == "") {
        alert("Please fill all the fields");
        return;
      }

      // price and quantity cannot be negative
      if (price < 0 || quantity < 0) {
        alert("Price and quantity cannot be negative");
        return;
      }

      // product id must be unique
      for (var i = 0; i < products.length; i++) {
        if (products[i].id == id && i != editIndex) {
          alert("This Product ID already exists");
          return;
        }
      }

      var product = {
        id: id,
        name: name,
        category: category,
        price: Number(price),
        quantity: Number(quantity)
      };

      if (editIndex == -1) {
        products.push(product);
      } else {
        products[editIndex] = product;
        editIndex = -1;
        document.getElementById("addButton").innerHTML = "Add Product";
      }

      // save and clear the form
      localStorage.setItem("products", JSON.stringify(products));
      document.getElementById("id").value = "";
      document.getElementById("name").value = "";
      document.getElementById("category").value = "";
      document.getElementById("price").value = "";
      document.getElementById("quantity").value = "";

      showProducts();
    }

    // show all products in the table and update the statistics
    function showProducts() {
      var search = document.getElementById("search").value.toLowerCase();
      var filter = document.getElementById("filter").value;

      var rows = "";
      var totalValue = 0;
      var lowStock = 0;

      for (var i = 0; i < products.length; i++) {
        var p = products[i];

        // find the status
        var status = "Available";
        if (p.quantity == 0) {
          status = "Out of Stock";
        } else if (p.quantity < 5) {
          status = "Low Stock";
          lowStock = lowStock + 1;
        }

        var value = p.price * p.quantity;
        totalValue = totalValue + value;

        // only show the product if it matches the search and the category
        var nameMatches = p.name.toLowerCase().includes(search);
        var categoryMatches = (filter == "All Categories" || filter == p.category);

        if (nameMatches && categoryMatches) {
          rows = rows + "<tr>";
          rows = rows + "<td>" + p.id + "</td>";
          rows = rows + "<td>" + p.name + "</td>";
          rows = rows + "<td>" + p.category + "</td>";
          rows = rows + "<td>₹" + p.price + "</td>";
          rows = rows + "<td>" + p.quantity +
            " <button onclick='plus(" + i + ")'>+</button>" +
            " <button onclick='minus(" + i + ")'>-</button></td>";
          rows = rows + "<td>" + status + "</td>";
          rows = rows + "<td>₹" + value + "</td>";
          rows = rows + "<td><button onclick='editProduct(" + i + ")'>Edit</button> " +
            "<button onclick='deleteProduct(" + i + ")'>Delete</button></td>";
          rows = rows + "</tr>";
        }
      }

      document.getElementById("tableBody").innerHTML = rows;
      document.getElementById("totalProducts").innerHTML = products.length;
      document.getElementById("totalValue").innerHTML = "₹" + totalValue;
      document.getElementById("lowStock").innerHTML = lowStock;
    }

    // increase quantity
    function plus(i) {
      products[i].quantity = products[i].quantity + 1;
      localStorage.setItem("products", JSON.stringify(products));
      showProducts();
    }

    // decrease quantity (but never below 0)
    function minus(i) {
      if (products[i].quantity > 0) {
        products[i].quantity = products[i].quantity - 1;
      }
      localStorage.setItem("products", JSON.stringify(products));
      showProducts();
    }

    // put the product back in the form so it can be changed
    function editProduct(i) {
      document.getElementById("id").value = products[i].id;
      document.getElementById("name").value = products[i].name;
      document.getElementById("category").value = products[i].category;
      document.getElementById("price").value = products[i].price;
      document.getElementById("quantity").value = products[i].quantity;

      editIndex = i;
      document.getElementById("addButton").innerHTML = "Update Product";
    }

    // delete a product after asking
    function deleteProduct(i) {
      var answer = confirm("Do you want to delete this product?");
      if (answer == true) {
        products.splice(i, 1);
        editIndex = -1;
        document.getElementById("addButton").innerHTML = "Add Product";
        localStorage.setItem("products", JSON.stringify(products));
        showProducts();
      }
    }

    // show the products when the page opens
    showProducts();
  </script>

</body>
</html>
