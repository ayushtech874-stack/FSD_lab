<!DOCTYPE html>
<html>
<head>
  <title>Inventory Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .container h2 {
      margin: 0;
      padding: 15px 20px;
      background-color: #f1f3f5;
      font-size: 18px;
      border-bottom: 1px solid #ddd;
    }

    .content {
      padding: 20px;
    }

    /* form */
    .form-row input,
    .form-row select {
      width: 18%;
      padding: 10px;
      margin-right: 6px;
      margin-bottom: 8px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      padding: 9px 16px;
      background-color: #343a40;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #212529;
    }

    #errorMsg {
      color: red;
      font-size: 14px;
      margin-left: 10px;
    }

    /* statistics */
    .stats {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .stat-box {
      flex: 1;
      background-color: #f1f3f5;
      text-align: center;
      padding: 18px;
      border-radius: 8px;
    }

    .stat-box h3 {
      margin: 0 0 5px 0;
      font-size: 24px;
    }

    .stat-box p {
      margin: 0;
      font-size: 16px;
    }

    /* search + filter */
    .controls {
      margin-top: 20px;
      margin-bottom: 15px;
    }

    .controls input,
    .controls select {
      padding: 7px;
      margin-right: 15px;
      border: 1px solid #bbb;
      border-radius: 5px;
    }

    /* table */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f1f3f5;
    }

    .small-btn {
      padding: 2px 8px;
      margin: 0 2px;
    }

    .edit-btn {
      background-color: #1c7ed6;
      padding: 5px 10px;
    }

    .delete-btn {
      background-color: #e03131;
      padding: 5px 10px;
    }

    .available { color: green; font-weight: bold; }
    .low { color: orange; font-weight: bold; }
    .out { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Inventory Management System</h2>

    <div class="content">

      <!-- product form -->
      <div class="form-row">
        <input type="text" id="productId" placeholder="Product ID">
        <input type="text" id="productName" placeholder="Product Name">
        <select id="category">
          <option value="">Category</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Food">Food</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" id="price" placeholder="Price">
        <input type="number" id="quantity" placeholder="Quantity">
      </div>

      <button id="addBtn" onclick="addOrUpdateProduct()">Add Product</button>
      <span id="errorMsg"></span>

      <!-- statistics -->
      <div class="stats">
        <div class="stat-box">
          <h3 id="totalProducts">0</h3>
          <p>Total Products</p>
        </div>
        <div class="stat-box">
          <h3 id="totalValue">₹0</h3>
          <p>Total Inventory Value</p>
        </div>
        <div class="stat-box">
          <h3 id="lowStock">0</h3>
          <p>Low Stock Products</p>
        </div>
      </div>

      <!-- search and filter -->
      <div class="controls">
        Search:
        <input type="text" id="searchBox" placeholder="Search product..." oninput="showProducts()">
        Category:
        <select id="filterCategory" onchange="showProducts()">
          <option value="All">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Food">Food</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- inventory table -->
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Inventory Value</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>

    </div>
  </div>

  <script>
    // this array stores all the products
    var products = [];

    // -1 means we are not editing anything right now
    var editIndex = -1;

    // get saved products from localStorage when page opens
    function loadProducts() {
      var saved = localStorage.getItem("products");
      if (saved != null) {
        products = JSON.parse(saved);
      }
    }

    // save products to localStorage
    function saveProducts() {
      localStorage.setItem("products", JSON.stringify(products));
    }

    // format number like Indian rupees  (350000 -> ₹3,50,000)
    function formatMoney(num) {
      return "₹" + num.toLocaleString("en-IN");
    }

    // find out the status using quantity
    function getStatus(qty) {
      if (qty == 0) {
        return "Out of Stock";
      } else if (qty >= 1 && qty <= 4) {
        return "Low Stock";
      } else {
        return "Available";
      }
    }

    // this function is used for both add and update
    function addOrUpdateProduct() {
      var id = document.getElementById("productId").value.trim();
      var name = document.getElementById("productName").value.trim();
      var category = document.getElementById("category").value;
      var price = document.getElementById("price").value;
      var quantity = document.getElementById("quantity").value;
      var error = document.getElementById("errorMsg");

      error.innerHTML = "";

      // check if any field is empty
      if (id == "" || name == "" || category == "" || price == "" || quantity == "") {
        error.innerHTML = "Please fill all the fields!";
        return;
      }

      // convert to numbers
      price = Number(price);
      quantity = Number(quantity);

      if (price < 0) {
        error.innerHTML = "Price cannot be negative!";
        return;
      }

      if (quantity < 0) {
        error.innerHTML = "Quantity cannot be negative!";
        return;
      }

      // check if product id already exists
      for (var i = 0; i < products.length; i++) {
        if (products[i].id == id && i != editIndex) {
          error.innerHTML = "Product ID already exists!";
          return;
        }
      }

      var product = {
        id: id,
        name: name,
        category: category,
        price: price,
        quantity: quantity
      };

      if (editIndex == -1) {
        // adding a new product
        products.push(product);
      } else {
        // updating the old product
        products[editIndex] = product;
        editIndex = -1;
        document.getElementById("addBtn").innerHTML = "Add Product";
      }

      saveProducts();
      clearForm();
      showProducts();
    }

    function clearForm() {
      document.getElementById("productId").value = "";
      document.getElementById("productName").value = "";
      document.getElementById("category").value = "";
      document.getElementById("price").value = "";
      document.getElementById("quantity").value = "";
    }

    // show the products in the table
    function showProducts() {
      var tableBody = document.getElementById("tableBody");
      var searchText = document.getElementById("searchBox").value.toLowerCase();
      var filter = document.getElementById("filterCategory").value;

      var html = "";

      for (var i = 0; i < products.length; i++) {
        var p = products[i];

        // search by name
        if (p.name.toLowerCase().indexOf(searchText) == -1) {
          continue;
        }

        // category filter
        if (filter != "All" && p.category != filter) {
          continue;
        }

        var status = getStatus(p.quantity);
        var statusClass = "available";
        if (status == "Low Stock") {
          statusClass = "low";
        } else if (status == "Out of Stock") {
          statusClass = "out";
        }

        var value = p.price * p.quantity;

        html += "<tr>";
        html += "<td>" + p.id + "</td>";
        html += "<td>" + p.name + "</td>";
        html += "<td>" + p.category + "</td>";
        html += "<td>" + formatMoney(p.price) + "</td>";
        html += "<td>" + p.quantity +
                " <button class='small-btn' onclick='changeQuantity(" + i + ", 1)'>+</button>" +
                "<button class='small-btn' onclick='changeQuantity(" + i + ", -1)'>-</button></td>";
        html += "<td class='" + statusClass + "'>" + status + "</td>";
        html += "<td>" + formatMoney(value) + "</td>";
        html += "<td><button class='edit-btn' onclick='editProduct(" + i + ")'>Edit</button> " +
                "<button class='delete-btn' onclick='deleteProduct(" + i + ")'>Delete</button></td>";
        html += "</tr>";
      }

      if (html == "") {
        html = "<tr><td colspan='8' style='text-align:center'>No products found</td></tr>";
      }

      tableBody.innerHTML = html;

      updateStats();
    }

    // plus and minus buttons
    function changeQuantity(index, change) {
      var newQty = products[index].quantity + change;

      // quantity should never go below 0
      if (newQty < 0) {
        return;
      }

      products[index].quantity = newQty;
      saveProducts();
      showProducts();
    }

    // put the product details back in the form
    function editProduct(index) {
      var p = products[index];

      document.getElementById("productId").value = p.id;
      document.getElementById("productName").value = p.name;
      document.getElementById("category").value = p.category;
      document.getElementById("price").value = p.price;
      document.getElementById("quantity").value = p.quantity;

      editIndex = index;
      document.getElementById("addBtn").innerHTML = "Update Product";
      document.getElementById("errorMsg").innerHTML = "";
    }

    function deleteProduct(index) {
      var sure = confirm("Are you sure you want to delete this product?");

      if (sure == true) {
        products.splice(index, 1);

        // if we were editing, reset the form
        if (editIndex != -1) {
          editIndex = -1;
          document.getElementById("addBtn").innerHTML = "Add Product";
          clearForm();
        }

        saveProducts();
        showProducts();
      }
    }

    // update the 3 boxes on top
    function updateStats() {
      var totalValue = 0;
      var lowCount = 0;

      for (var i = 0; i < products.length; i++) {
        totalValue = totalValue + products[i].price * products[i].quantity;

        if (products[i].quantity >= 1 && products[i].quantity <= 4) {
          lowCount++;
        }
      }

      document.getElementById("totalProducts").innerHTML = products.length;
      document.getElementById("totalValue").innerHTML = formatMoney(totalValue);
      document.getElementById("lowStock").innerHTML = lowCount;
    }

    // run when page loads
    loadProducts();
    showProducts();
  </script>

</body>
</html>
