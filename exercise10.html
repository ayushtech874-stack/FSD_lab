<!DOCTYPE html>
<html>
<head>
    <title>Digital Watch and Stopwatch</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #838282;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background-color: rgb(110, 110, 110);
        }

        .clock, .stopwatch {
            margin: 20px 0;
            padding: 20px;
            background-color: rgb(167, 132, 132);
            color: white;
        }

        .time {
            font-size: 36px;
            margin: 15px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            color: white;
            background-color: rgb(5, 5, 5);
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Digital Watch</h1>

        <section class="clock">
            <h2>Current Time</h2>
            <p class="time" id="clock" aria-live="off">00:00:00</p>
        </section>

        <section class="stopwatch">
            <h2>Stopwatch</h2>
            <p class="time" id="stopwatch" aria-live="off">00:00:00</p>

            <button type="button" id="start">Start</button>
            <button type="button" id="pause">Pause</button>
            <button type="button" id="reset">Reset</button>
        </section>
    </div>
    <script>
        const clock = document.getElementById('clock');
        // const clock = document.querySelector('#clock')

        setInterval(function () {
            let date = new Date();
            clock.innerHTML = date.toLocaleTimeString();
        }, 1000);
         let startTime = 0, elapsed = 0, running = false;
        const getSec = () => Math.floor(Date.now() / 1000);

        function update() {
            // Clock formatted using standard local time string
            document.getElementById("clock").textContent = new Date().toTimeString().slice(0, 8);

            // Stopwatch formatted using ISO UTC string (00:00:00)
            let sec = running ? getSec() - startTime : elapsed;
            document.getElementById("watch").textContent = new Date(sec * 1000).toISOString().slice(11, 19);
        }

        function start() {
            if (!running) {
                startTime = getSec() - elapsed;
                running = true;
            }
        }

        function stop() {
            if (running) {
                elapsed = getSec() - startTime;
                running = false;
            }
        }

        function reset() {
            running = false;
            elapsed = 0;
            update();
        }

        setInterval(update, 200);
        update();
    </script>


    </script>
</body>
</html>
